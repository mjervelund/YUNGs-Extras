pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'yungsextras'
include("Common", "NeoForge")
// Fabric is not ported to 26.3 (our server runs NeoForge only); pass -Pwith_fabric to include it.
if (providers.gradleProperty("with_fabric").isPresent()) include("Fabric")
